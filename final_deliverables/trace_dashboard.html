<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudServe Pipeline Trace Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-panel);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .trace-grid {
            display: grid;
            gap: 1.5rem;
        }

        .trace-card {
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .trace-header {
            padding: 1rem 1.5rem;
            background: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-auto { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-escalate { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-block { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }

        .pipeline-steps {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .step {
            position: relative;
            padding-left: 1.5rem;
            border-left: 2px solid var(--accent-blue);
        }

        .step-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .step-content {
            font-size: 0.95rem;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .step::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-blue);
        }

        .btn-refresh {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CloudServe Pipeline Visualizer</h1>
        <button class="btn-refresh" onclick="fetchData()">Refresh Traces</button>
    </div>

    <div class="stats-container" id="stats">
        <!-- Stats populated here -->
    </div>

    <div class="trace-grid" id="traces">
        <!-- Traces populated here -->
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8001';

        async function fetchData() {
            try {
                const metricsRes = await fetch(`${API_URL}/metrics`);
                const metrics = await metricsRes.json();
                renderStats(metrics);

                const decisionsRes = await fetch(`${API_URL}/decisions?limit=10`);
                const decisions = await decisionsRes.json();
                renderTraces(decisions.reverse()); // Show newest first
            } catch (err) {
                console.error("Failed to fetch data:", err);
                document.getElementById('traces').innerHTML = `<p style="color:var(--accent-red)">Error connecting to API. Is the server running? Note: CORS may block local file access, you might need to run via a local server.</p>`;
            }
        }

        function renderStats(metrics) {
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${metrics.total_processed}</div>
                    <div class="stat-label">Total Tickets Processed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--accent-green)">${metrics.auto_respond_count}</div>
                    <div class="stat-label">Auto-Responded</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--accent-red)">${metrics.escalation_count}</div>
                    <div class="stat-label">Escalated / Blocked</div>
                </div>
            `;
        }

        function renderTraces(decisions) {
            const container = document.getElementById('traces');
            container.innerHTML = '';

            decisions.forEach(d => {
                const actionClass = d.action_taken === 'auto_respond' ? 'badge-auto' : 'badge-escalate';
                const guardrails = d.guardrail_results || {};
                const sources = (d.sources_used || []).map(s => s.chunk_id).join(', ') || 'None';
                
                const card = document.createElement('div');
                card.className = 'trace-card';
                card.innerHTML = `
                    <div class="trace-header">
                        <div>
                            <strong>${d.ticket_id}</strong> &bull; <span style="color:var(--text-muted)">${new Date(d.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <span class="badge ${actionClass}">${d.action_taken.toUpperCase()}</span>
                    </div>
                    <div class="pipeline-steps">
                        <div class="step">
                            <div class="step-title">1. Ingestion</div>
                            <div class="step-content">${d.input_summary}</div>
                        </div>
                        <div class="step">
                            <div class="step-title">2. Classification</div>
                            <div class="step-content">Intent: ${d.prediction.value}
Confidence: ${(d.prediction.confidence * 100).toFixed(1)}%
Urgency: ${d.prediction.urgency}</div>
                        </div>
                        <div class="step">
                            <div class="step-title">3. Retrieval & Guardrails</div>
                            <div class="step-content">Docs Retrieved: ${sources}
PII Check: ${guardrails.pii}
Tone Check: ${guardrails.tone}</div>
                        </div>
                        <div class="step">
                            <div class="step-title">4. Routing Decision</div>
                            <div class="step-content">${d.reason}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Initial fetch
        fetchData();
        // Auto-refresh every 5 seconds
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
