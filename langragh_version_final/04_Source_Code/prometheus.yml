global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "cloudserve_fastapi"
    metrics_path: "/metrics/"
    # Note: Use 'host.docker.internal' instead of 'localhost' if running on Docker Desktop (Windows/Mac)
    static_configs:
      - targets: ["host.docker.internal:8001"]
